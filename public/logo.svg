<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c040"/>
      <stop offset="50%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#a07c10"/>
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1f10"/>
      <stop offset="100%" stop-color="#1a1208"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="url(#dark)" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
  <!-- Chef hat icon -->
  <g transform="translate(100, 65)" filter="url(#glow)">
    <!-- Hat base -->
    <rect x="-22" y="5" width="44" height="15" rx="3" fill="url(#gold)"/>
    <!-- Hat puff -->
    <ellipse cx="0" cy="-5" rx="25" ry="18" fill="url(#gold)"/>
    <circle cx="-15" cy="-8" r="10" fill="url(#gold)"/>
    <circle cx="15" cy="-8" r="10" fill="url(#gold)"/>
    <circle cx="0" cy="-15" r="10" fill="url(#gold)"/>
  </g>
  <!-- Arabic text -->
  <text x="100" y="115" fill="url(#gold)" font-family="Cairo, sans-serif" font-size="22" font-weight="900" text-anchor="middle">صناع</text>
  <text x="100" y="140" fill="url(#gold)" font-family="Cairo, sans-serif" font-size="22" font-weight="900" text-anchor="middle">الطعم</text>
  <!-- Decorative line -->
  <line x1="50" y1="155" x2="150" y2="155" stroke="url(#gold)" stroke-width="1.5"/>
  <!-- Stars -->
  <text x="70" y="172" fill="url(#gold)" font-size="10" text-anchor="middle">★</text>
  <text x="100" y="172" fill="url(#gold)" font-size="10" text-anchor="middle">★</text>
  <text x="130" y="172" fill="url(#gold)" font-size="10" text-anchor="middle">★</text>
  <!-- English text -->
  <text x="100" y="188" fill="url(#gold)" font-family="Poppins, sans-serif" font-size="7" font-weight="600" text-anchor="middle" letter-spacing="3">TASTE MAKERS</text>
</svg>
